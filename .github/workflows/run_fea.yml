name: Run Structural FEA (OpenSeesPy)

on:
  push:
    paths:
      - 'backend/building.json'
  workflow_dispatch:
  repository_dispatch:
    types: [run_fea] # Allows manual triggering via API

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit results back

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libblas-dev liblapack-dev

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openseespy

    - name: Prepare Input Data
      if: github.event_type == 'run_fea'
      run: |
        echo '${{ github.event.client_payload.building_data }}' > backend/building.json

    - name: Run OpenSeesPy Analysis
      working-directory: ./backend
      run: |
        python analyze.py
        # Verify the results file was created
        if [ ! -f results.json ]; then
          echo "ERROR: results.json was not generated!"
          exit 1
        fi

    - name: Commit and Push Results
      run: |
        git config --global user.name "SamStruture-Bot"
        git config --global user.email "bot@samstruture.app"
        # Only add if file exists
        if [ -f backend/results.json ]; then
          git add backend/results.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update: FEA results"
          git push
        else
          echo "WARNING: backend/results.json not found, skipping commit"
          exit 1
        fi
